name: Release DMG
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing RC tag to build and publish
        required: true
        type: string
permissions:
  contents: write
concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false
jobs:
  release:
    runs-on: macos-26-intel
    timeout-minutes: 90
    env:
      QEQ_HARDWARE_TESTS: '0'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}
      - name: Verify release source
        env:
          WORKFLOW_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          RELEASE_REF_NAME="${WORKFLOW_TAG:-$GITHUB_REF_NAME}"
          [[ "$RELEASE_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+-rc\.[0-9]+$ ]]
          git fetch origin main
          git merge-base --is-ancestor HEAD origin/main
          [[ "$(git rev-parse HEAD)" == "$(git rev-parse "$RELEASE_REF_NAME^{commit}")" ]]
          echo "RELEASE_REF_NAME=$RELEASE_REF_NAME" >> "$GITHUB_ENV"
      - name: Validate release record
        run: |
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          c = json.loads(Path('QEQ/release.json').read_text())
          assert 'v' + c['version'] == os.environ['RELEASE_REF_NAME']
          assert c['notarized'] is True and c['signing'] == 'Developer ID Application'
          assert Path('QEQ/ReleaseNotes', c['version'] + '.md').is_file()
          PY
      - name: Install declared tools
        run: brew bundle
      - name: Validate source and universal build
        run: |
          python3 QEQ/scripts/screenshots.py --check
          ./QEQ/scripts/check.sh
      - name: Render screenshots from the release source
        run: python3 QEQ/scripts/screenshots.py --skip-build --output QEQ/.release/screenshots
      - name: Upload rendered screenshots
        uses: actions/upload-artifact@v4
        with:
          name: QEQ-screenshots-${{ env.RELEASE_REF_NAME }}
          path: QEQ/.release/screenshots/*
          include-hidden-files: true
          if-no-files-found: error
      - name: Prepare temporary signing keychain
        env:
          APPLE_DEVELOPER_ID_APP_CERT_BASE64: ${{ secrets.APPLE_DEVELOPER_ID_APP_CERT_BASE64 }}
          APPLE_DEVELOPER_ID_APP_CERT_PASSWORD: ${{ secrets.APPLE_DEVELOPER_ID_APP_CERT_PASSWORD }}
          APPLE_NOTARY_API_KEY_P8: ${{ secrets.APPLE_NOTARY_API_KEY_P8 }}
        run: |
          set -euo pipefail
          umask 077
          CERT_PATH="$RUNNER_TEMP/qeq-developer-id.p12"
          KEYCHAIN_PATH="$RUNNER_TEMP/qeq-release.keychain-db"
          NOTARY_KEY_PATH="$RUNNER_TEMP/qeq-notary.p8"
          export CERT_PATH NOTARY_KEY_PATH
          {
            echo "CERT_PATH=$CERT_PATH"
            echo "KEYCHAIN_PATH=$KEYCHAIN_PATH"
            echo "NOTARY_KEY_PATH=$NOTARY_KEY_PATH"
          } >> "$GITHUB_ENV"
          python3 - <<'PY'
          import base64, os
          from pathlib import Path
          for name in ('APPLE_DEVELOPER_ID_APP_CERT_BASE64', 'APPLE_DEVELOPER_ID_APP_CERT_PASSWORD', 'APPLE_NOTARY_API_KEY_P8'):
              if not os.environ[name]:
                  raise SystemExit(f'Missing secret: {name}')
          Path(os.environ['CERT_PATH']).write_bytes(base64.b64decode(os.environ['APPLE_DEVELOPER_ID_APP_CERT_BASE64'], validate=True))
          Path(os.environ['NOTARY_KEY_PATH']).write_text(os.environ['APPLE_NOTARY_API_KEY_P8'])
          PY
          KEYCHAIN_PASSWORD="$(uuidgen)"
          echo "::add-mask::$KEYCHAIN_PASSWORD"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERT_PATH" -k "$KEYCHAIN_PATH" -P "$APPLE_DEVELOPER_ID_APP_CERT_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH" >/dev/null
          security list-keychains -d user -s "$KEYCHAIN_PATH" login.keychain-db
      - name: Sign, notarize, staple, and assess app and DMG
        env:
          APPLE_DEVELOPER_TEAM_ID: ${{ secrets.APPLE_DEVELOPER_TEAM_ID }}
          APPLE_NOTARY_KEY_ID: ${{ secrets.APPLE_NOTARY_KEY_ID }}
          APPLE_NOTARY_ISSUER_ID: ${{ secrets.APPLE_NOTARY_ISSUER_ID }}
        run: python3 QEQ/scripts/build_release.py
      - name: Upload verified release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: QEQ-${{ env.RELEASE_REF_NAME }}
          path: QEQ/.release/*/artifacts/*
          include-hidden-files: true
          if-no-files-found: error
      - name: Publish private prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          VERSION="${RELEASE_REF_NAME#v}"
          if gh release view "$RELEASE_REF_NAME" >/dev/null 2>&1; then
            echo "Release already exists; refusing to replace published artifacts." >&2
            exit 1
          fi
          gh release create "$RELEASE_REF_NAME" --verify-tag --prerelease --latest=false \
            --title "QEQ $VERSION" --notes-file "QEQ/ReleaseNotes/$VERSION.md" \
            QEQ/.release/"$VERSION"/artifacts/*
      - name: Retain notarization diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: notarization-${{ github.run_id }}-${{ github.run_attempt }}
          path: QEQ/.release/*/logs/*
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 14
      - name: Retain screenshot diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: screenshot-diagnostics-${{ github.run_id }}
          path: QEQ/.release/screenshot-render.sample.txt
          if-no-files-found: ignore
          retention-days: 7
      - name: Remove signing material
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/qeq-release.keychain-db" 2>/dev/null || true
          rm -f "$RUNNER_TEMP/qeq-developer-id.p12" "$RUNNER_TEMP/qeq-notary.p8"
