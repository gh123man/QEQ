name: QEQ
options:
  minimumXcodeGenVersion: 2.45.3
  deploymentTarget:
    macOS: "14.4"
configs:
  Debug: debug
  Release: release
settings:
  base:
    ARCHS: arm64
    SWIFT_VERSION: 6.0
    OTHER_LDFLAGS: ["$(inherited)", "-lc++"]
    CURRENT_PROJECT_VERSION: 1
    MARKETING_VERSION: 0.1.0
packages:
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    exactVersion: 2.9.3
targets:
  QEQHardware:
    type: library.static
    platform: macOS
    sources:
      - path: Sources/QEQHardware
        excludes: ["LZ4/LICENSE"]
    dependencies:
      - sdk: IOUSBHost.framework
      - sdk: IOKit.framework
      - sdk: libz.tbd
    settings:
      base:
        PRODUCT_NAME: QEQHardware
        DEFINES_MODULE: YES
        CLANG_ENABLE_OBJC_ARC: YES
        HEADER_SEARCH_PATHS: "$(SRCROOT)/Sources/QEQHardware/include"
        MODULEMAP_FILE: "$(SRCROOT)/Sources/QEQHardware/include/module.modulemap"
  MixerDSP:
    type: library.static
    platform: macOS
    sources:
      - path: Sources/MixerDSP
    settings:
      base:
        PRODUCT_NAME: MixerDSP
        DEFINES_MODULE: YES
        CLANG_CXX_LANGUAGE_STANDARD: c++17
        HEADER_SEARCH_PATHS: "$(SRCROOT)/Sources/MixerDSP/include"
        MODULEMAP_FILE: "$(SRCROOT)/Sources/MixerDSP/include/module.modulemap"

  QEQCore:
    type: library.static
    platform: macOS
    deploymentTarget: "14.4"
    sources:
      - path: Sources/QEQCore
    dependencies:
      - target: MixerDSP
    settings:
      base:
        PRODUCT_NAME: QEQCore
        DEFINES_MODULE: YES

  QEQAppSupport:
    type: library.static
    platform: macOS
    deploymentTarget: "14.4"
    sources:
      - path: Sources/QEQAppSupport
    dependencies:
      - target: QEQHardware
      - sdk: Metal.framework
      - target: QEQCore
      - target: MixerDSP
      - sdk: CoreMIDI.framework
    settings:
      base:
        PRODUCT_NAME: QEQAppSupport
        DEFINES_MODULE: YES

  QEQ:
    type: application
    platform: macOS
    deploymentTarget: "14.4"
    sources:
      - path: App/Sources
      - path: App/Resources
        buildPhase: resources
        optional: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: local.AppMixer
        PRODUCT_NAME: QEQ
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: App/Info.plist
        CODE_SIGN_STYLE: Automatic
        ENABLE_HARDENED_RUNTIME: YES
        SUPPORTS_MACCATALYST: NO
    dependencies:
      - target: QEQCore
      - target: MixerDSP
      - target: QEQAppSupport
      - target: QEQHardware
      - sdk: IOUSBHost.framework
      - sdk: IOKit.framework
      - sdk: libz.tbd
      - package: Sparkle
        product: Sparkle
    scheme:
      gatherCoverageData: false
      testTargets:
        - QEQTests

  QEQTests:
    type: bundle.unit-test
    platform: macOS
    deploymentTarget: "14.4"
    sources:
      - path: Tests/QEQTests
    dependencies:
      - target: DisplayReceiverTestSupport
      - target: QEQHardware
      - target: QEQCore
      - target: MixerDSP
      - target: QEQAppSupport
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: local.AppMixer.tests

  DisplayReceiverTestSupport:
    type: library.static
    platform: macOS
    sources:
      - path: Tests/DisplayReceiverSupport
        excludes: ["README.md"]
    dependencies:
      - target: QEQHardware
    settings:
      base:
        PRODUCT_NAME: DisplayReceiverTestSupport
        DEFINES_MODULE: YES
        CLANG_CXX_LANGUAGE_STANDARD: c++17
        HEADER_SEARCH_PATHS: ["$(SRCROOT)/Tests/DisplayReceiverSupport/include", "$(SRCROOT)/Sources/QEQHardware/LZ4"]
        MODULEMAP_FILE: "$(SRCROOT)/Tests/DisplayReceiverSupport/include/module.modulemap"
