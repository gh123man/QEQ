name: AppMixer
options:
  minimumXcodeGenVersion: 2.45.3
  deploymentTarget:
    macOS: "14.4"
configs:
  Debug: debug
  Release: release
settings:
  base:
    SWIFT_VERSION: 6.0
    OTHER_LDFLAGS: ["$(inherited)", "-lc++"]
    CURRENT_PROJECT_VERSION: 1
    MARKETING_VERSION: 0.1.0
targets:
  MixerDSP:
    type: library.static
    platform: macOS
    sources:
      - path: Sources/MixerDSP
    settings:
      base:
        PRODUCT_NAME: MixerDSP
        DEFINES_MODULE: YES
        CLANG_CXX_LANGUAGE_STANDARD: c++17
        HEADER_SEARCH_PATHS: "$(SRCROOT)/Sources/MixerDSP/include"
        MODULEMAP_FILE: "$(SRCROOT)/Sources/MixerDSP/include/module.modulemap"

  AppMixerCore:
    type: library.static
    platform: macOS
    deploymentTarget: "14.4"
    sources:
      - path: Sources/AppMixerCore
    dependencies:
      - target: MixerDSP
    settings:
      base:
        PRODUCT_NAME: AppMixerCore
        DEFINES_MODULE: YES

  AppMixerAppSupport:
    type: library.static
    platform: macOS
    deploymentTarget: "14.4"
    sources:
      - path: Sources/AppMixerAppSupport
    dependencies:
      - target: AppMixerCore
      - target: MixerDSP
    settings:
      base:
        PRODUCT_NAME: AppMixerAppSupport
        DEFINES_MODULE: YES

  AppMixer:
    type: application
    platform: macOS
    deploymentTarget: "14.4"
    sources:
      - path: App/Sources
      - path: App/Resources
        buildPhase: resources
        optional: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: local.AppMixer
        PRODUCT_NAME: AppMixer
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: App/Info.plist
        CODE_SIGN_STYLE: Automatic
        ENABLE_HARDENED_RUNTIME: YES
        SUPPORTS_MACCATALYST: NO
    dependencies:
      - target: AppMixerCore
      - target: MixerDSP
      - target: AppMixerAppSupport
    scheme:
      gatherCoverageData: false
      testTargets:
        - AppMixerTests

  AppMixerTests:
    type: bundle.unit-test
    platform: macOS
    deploymentTarget: "14.4"
    sources:
      - path: Tests/AppMixerTests
    dependencies:
      - target: AppMixerCore
      - target: MixerDSP
      - target: AppMixerAppSupport
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: local.AppMixer.tests
